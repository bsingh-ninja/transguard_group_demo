name: transguard-group-demo

services:
  db:
    image: postgres:16-alpine
    container_name: transguard-demo-db
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demos
    ports:
      - "5434:5432"
    volumes:
      - transguard-demo-pg:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  transguard-demo-pg:
