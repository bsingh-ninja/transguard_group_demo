name: Docker image

# Builds the demo's container image and publishes it to the GitHub container registry of the
# Ninjatech-DevOps organisation, for the separate deployment. Runs only in that organisation's repo.
# The image serves the app on port 7860; at runtime it needs GEMINI_API_KEY (and optionally
# DEMO_PASSWORD to turn on a password prompt, user name "demo").
# Optional: set the secret DEPLOY_WEBHOOK_URL to a deploy hook of the hosting service so it
# redeploys after each new image.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish image
    if: github.repository_owner == 'Ninjatech-DevOps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger deploy hook
        env:
          HOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "No DEPLOY_WEBHOOK_URL secret; image published only."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Deploy hook called."
