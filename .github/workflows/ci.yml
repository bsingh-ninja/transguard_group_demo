name: CI

# Runs on every push to main, on pull requests, and by hand from the Actions tab.
# Hosting: Render redeploys main on every push. The deploy job below targets a
# Hugging Face Space instead and stays off until the variable HF_SPACE is set.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (format, lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
        env:
          # Set the repository variable NEXT_PUBLIC_API_URL to build for a hosted API.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8002' }}

  api:
    name: API (style, seed and smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: demos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://demo:demo@localhost:5432/demos
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Code style (ruff)
        run: ruff check . && ruff format --check .
      - run: python -m compileall -q app scripts
      - name: Seed demo data
        run: python -m app.transguard.seed
      - name: Start API
        run: |
          python -m uvicorn app.main:app --port 8002 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8002/health && exit 0; sleep 1; done
          cat uvicorn.log
          exit 1
      - name: Smoke test
        run: python scripts/smoke.py http://127.0.0.1:8002
      - name: API log
        if: failure()
        run: cat uvicorn.log || true

  deploy:
    name: Deploy to Hugging Face Space
    # Runs after both checks pass on main, once the repository has the variable HF_SPACE
    # (e.g. owner/space-name) and the secrets HF_TOKEN, GEMINI_API_KEY and DEMO_PASSWORD.
    if: github.event_name == 'push' && vars.HF_SPACE != ''
    needs: [web, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==2.4.0
      - run: python deploy/hf_space.py "${{ vars.HF_SPACE }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
